name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
      - 'package*.json'
      - 'tsconfig.json'
      - 'jest.config.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
      - 'package*.json'
      - 'tsconfig.json'
      - 'jest.config.js'

jobs:
  test:
    name: TypeScript CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail_ci_if_error: false
        continue-on-error: true
